name: Publish image assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build manifest and content-addressed assets
        run: node scripts/build-asset-manifest.js --out release-assets
      - name: Create the dedicated asset release when needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view assets-v1 --repo "${{ github.repository }}" >/dev/null 2>&1 || gh release create assets-v1 --repo "${{ github.repository }}" --title "Application image assets" --notes "On-demand image assets for the desktop app." --latest=false
      - name: Upload only new content-addressed files and replace manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view assets-v1 --repo "${{ github.repository }}" --json assets --jq '.assets[].name' > existing-assets.txt
          while IFS= read -r file; do
            name="$(basename "$file")"
            if ! grep -Fxq "$name" existing-assets.txt; then
              gh release upload assets-v1 "$file" --repo "${{ github.repository }}"
            fi
          done < <(find release-assets/files -type f -print)
          gh release upload assets-v1 release-assets/manifest.json --repo "${{ github.repository }}" --clobber
